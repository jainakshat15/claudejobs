name: Bug report
description: Something behaves differently from what the docs say
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't paste tokens, connection strings or the contents of `.env`.
        For a security issue, report it privately instead — see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Queue a job with `/run dir:... fix the tests`
        2. ...
    validations:
      required: true

  - type: textarea
    id: selfcheck
    attributes:
      label: Output of `python -m claudejobs selfcheck`
      description: Redact anything sensitive. This answers most environment questions at once.
      render: text

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0, or the commit sha
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system of the machine running the dispatcher
      options: [Windows, Linux, macOS]
    validations:
      required: true

  - type: dropdown
    id: terminal-mode
    attributes:
      label: TERMINAL_MODE
      options: [auto, wt, cmd, gnome-terminal, konsole, xfce4-terminal, alacritty, kitty, xterm, macos, headless]

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        The job log from `LOG_DIR` (`job-<id>.log`), and the console output of the
        dispatcher or API. Redact tokens and paths you'd rather not share.
      render: text
